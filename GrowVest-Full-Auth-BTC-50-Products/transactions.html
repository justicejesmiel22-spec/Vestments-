<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Transactions — GrowVest</title><link rel="stylesheet" href="styles.css"><script src="config.js"></script><script src="common.js"></script><script src="auth.js"></script><script>document.addEventListener("DOMContentLoaded",requireAuth)</script></head><body><header class="nav"><a class="brand" href="index.html"><b>G</b> GrowVest</a><button class="toggle">☰</button><nav class="links"><a href="products.html">Investments</a><a href="dashboard.html">Dashboard</a><a href="wallet.html">BTC Wallet</a><a href="transactions.html">Transactions</a><a href="profile.html">Profile</a></nav><a class="btn secondary nav-login" href="logout.html">Logout</a></header><main class="container"><span class="eyebrow">LEDGER</span><h1>Transactions</h1><div class="card tablewrap"><table class="table"><thead><tr><th>Date</th><th>Type</th><th>Product</th><th>BTC</th><th>Status</th></tr></thead><tbody id="rows"></tbody></table></div></main><script>rows.innerHTML=getState().transactions.map(x=>`<tr><td>${new Date(x.date).toLocaleString()}</td><td>${x.type}</td><td>${x.product}</td><td>${Number(x.btc||0).toFixed(8)}</td><td><span class="status ${x.status.includes("Pending")||x.status.includes("Awaiting")?"pending":""}">${x.status}</span></td></tr>`).join("")||"<tr><td colspan=5>No transactions.</td></tr>";</script></body></html>
