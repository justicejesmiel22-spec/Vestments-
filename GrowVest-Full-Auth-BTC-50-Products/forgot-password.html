<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width,initial-scale=1">
        <title>Password Reset — GrowVest</title>
        <link rel="stylesheet" href="styles.css">
        <script src="auth.js"></script>
    </head>
    <body class="auth-page">
        <div class="auth-shell">
            <a class="brand auth-brand" href="index.html" style="color: #524d4d;"><span class=""><button style="background: #524d4d; border: none; color: #fff; width: 34px; height: 34px; font-size: 25px; border-radius: 5px;">G</button> GrowVest</span></a>
            <div class="auth-card">
                <span class="eyebrow">PASSWORD RECOVERY</span>
                <h1>Reset your password</h1>
                <p class="muted">Enter your account email. In production, a time-limited reset link would be sent to your verified email.</p>

        <form id="resetForm">
            <label>Email<input id="email" type="email" required autocomplete="email" style="border: solid 1px #ccc; border-radius:10px; width:100%; padding: 0 10px; height: 40px; margin-bottom: 5px; margin-top: 10px;"></label>
            <button class="btn primary full">Request reset</button></form>
            <p class="auth-switch"><a href="login.html">Return to login</a></p>
<div class="notice">This static demo does not send real emails or change passwords.</div>
</div></div>
<script>resetForm.addEventListener("submit",e=>{e.preventDefault();
    if(!validEmail(email.value.trim()))return toast("Enter a valid email.");
    toast("A reset link has been sent to your email!");});
    </script>
    </body></html>
