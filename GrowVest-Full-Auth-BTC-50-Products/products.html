<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width,initial-scale=1">
        <title>Investments — GrowVest</title>
        <link rel="stylesheet" href="styles.css">
        <script src="config.js"></script>
        <script src="products.js"></script>
        <script src="common.js"></script>
    </head>
    <body>
        <header class="nav">
            <a class="brand" href="index.html"><b>G</b> GrowVest</a>
            <button class="toggle">☰</button>
            <nav class="links">
                <a href="products.html">Investments</a>
                <a href="dashboard.html">Dashboard</a>
                <a href="wallet.html">BTC Wallet</a>
                <a href="transactions.html">Transactions</a>
                <a href="kyc.html">KYC</a>
                <a href="profile.html">Profile</a>
            </nav>
            <a class="btn secondary nav-login" href="login.html">Login</a>
            <a class="btn primary nav-register" href="register.html">Register</a>
            </header><main class="container">
                <span class="eyebrow">50 OPPORTUNITIES</span>
                <h1>Investment marketplace</h1>
                <p class="muted">Grow with trust, No Risk, invest and expect your full percent return.</p>
                <div class="toolbar">
                    <input class="input" id="search" placeholder="Search products…">
                    <select class="select" id="cat">
                        <option value="all">All categories</option>
                        <option value="crypto">Crypto</option>
                        <option value="agriculture">Agriculture</option>
                        <option value="realestate">Real Estate</option>
                    </select>
                </div>
                <div id="products" class="grid grid3">

                </div>
                </main>
        <footer>Smarter Financial Future</footer>
        <script>
const params=new URLSearchParams(location.search); 
if(params.get("category")) 
cat.value=params.get("category");
 function render(){
    let q=search.value.toLowerCase(),c=cat.value;products.innerHTML=PRODUCTS.filter(p=>(c==="all"||p.category===c)&&p.name.toLowerCase().includes(q)).map(p=>`<article class="card product"><span class="tag">${p.category.toUpperCase()}</span><h3>${p.name}</h3><p class="muted">Simulated ${p.category} Real invesment with growVest.</p><div class="meta"><span>Min $${p.min}</span><span>${p.return}</span><span>${p.risk}</span></div><a class="btn primary full" href="product.html?id=${p.id}">View details</a></article>`).join("")}search.oninput=render;cat.onchange=render;render();
        </script>
</body>
</html>
